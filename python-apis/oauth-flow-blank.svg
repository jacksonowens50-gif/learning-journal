<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" width="760" height="600" style="font-family:ui-sans-serif,system-ui,-apple-system,sans-serif">
  <title>OAuth authorization code flow — unlabeled scaffold</title>
  <rect x="0" y="0" width="760" height="600" fill="#faf9f5"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a67"/>
    </marker>
  </defs>

  <rect x="8" y="272" width="744" height="86" rx="6" fill="#f0eee6"/>
  <text x="20" y="290" font-size="10.5" font-weight="600" fill="#6b6a67" letter-spacing="0.4">BACK CHANNEL — server to server, browser never sees it</text>

  <g font-size="13" font-weight="600" text-anchor="middle" fill="#1f1e1d">
    <rect x="15" y="26" width="150" height="42" rx="6" fill="#f0eee6" stroke="#d5d2c8"/>
    <text x="90" y="52">User</text>
    <rect x="195" y="26" width="150" height="42" rx="6" fill="#f0eee6" stroke="#d5d2c8"/>
    <text x="270" y="52">Your App</text>
    <rect x="395" y="26" width="150" height="42" rx="6" fill="#f0eee6" stroke="#d5d2c8"/>
    <text x="470" y="52">Auth Server</text>
    <rect x="595" y="26" width="150" height="42" rx="6" fill="#f0eee6" stroke="#d5d2c8"/>
    <text x="670" y="52">API</text>
  </g>

  <g stroke="#d5d2c8" stroke-width="1" stroke-dasharray="3 4">
    <line x1="90" y1="68" x2="90" y2="545"/>
    <line x1="270" y1="68" x2="270" y2="545"/>
    <line x1="470" y1="68" x2="470" y2="545"/>
    <line x1="670" y1="68" x2="670" y2="545"/>
  </g>

  <g stroke="#6b6a67" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="90"  y1="112" x2="264" y2="112"/>
    <line x1="270" y1="160" x2="464" y2="160"/>
    <line x1="90"  y1="208" x2="464" y2="208"/>
    <line x1="470" y1="252" x2="276" y2="252"/>
    <line x1="270" y1="312" x2="464" y2="312"/>
    <line x1="470" y1="348" x2="276" y2="348"/>
    <line x1="270" y1="404" x2="664" y2="404"/>
    <line x1="670" y1="446" x2="276" y2="446"/>
    <line x1="270" y1="516" x2="464" y2="516"/>
  </g>

  <g stroke="#d5d2c8" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="112" y1="98"  x2="252" y2="98"/>
    <line x1="300" y1="146" x2="440" y2="146"/>
    <line x1="207" y1="194" x2="347" y2="194"/>
    <line x1="303" y1="238" x2="443" y2="238"/>
    <line x1="300" y1="298" x2="440" y2="298"/>
    <line x1="303" y1="334" x2="443" y2="334"/>
    <line x1="397" y1="390" x2="537" y2="390"/>
    <line x1="400" y1="432" x2="540" y2="432"/>
    <line x1="300" y1="502" x2="440" y2="502"/>
  </g>

  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <g fill="#faf9f5" stroke="#6b6a67" stroke-width="1.2">
      <circle cx="177" cy="112" r="9"/><circle cx="367" cy="160" r="9"/><circle cx="277" cy="208" r="9"/>
      <circle cx="373" cy="252" r="9"/><circle cx="367" cy="312" r="9"/><circle cx="373" cy="348" r="9"/>
      <circle cx="467" cy="404" r="9"/><circle cx="470" cy="446" r="9"/><circle cx="367" cy="516" r="9"/>
    </g>
    <g fill="#1f1e1d" stroke="none">
      <text x="177" y="116">1</text><text x="367" y="164">2</text><text x="277" y="212">3</text>
      <text x="373" y="256">4</text><text x="367" y="316">5</text><text x="373" y="352">6</text>
      <text x="467" y="408">7</text><text x="470" y="450">8</text><text x="367" y="520">9</text>
    </g>
  </g>

  <g font-size="10" fill="#6b6a67">
    <text x="20" y="132" font-style="italic">front channel — through the browser</text>
    <text x="20" y="472" font-weight="600">…40 minutes later, nobody logged in…</text>
  </g>

  <line x1="8" y1="484" x2="752" y2="484" stroke="#d5d2c8" stroke-width="1" stroke-dasharray="2 5"/>
</svg>
